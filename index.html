<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pytest in the Browser</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #10151c;
    --border: #232b36;
    --text: #d6dce5;
    --muted: #7b8794;
    --accent: #4fb0ff;
    --pass: #3fb950;
    --fail: #f85149;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 32px 24px 64px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0; font-size: 14px; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .panel-head {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  textarea {
    width: 100%;
    height: 280px;
    background: var(--panel);
    color: var(--text);
    border: none;
    padding: 14px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
    tab-size: 4;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }
  button#run {
    background: var(--accent);
    color: #06202f;
    border: none;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
  }
  button#run:disabled { opacity: 0.5; cursor: default; }
  button#run:hover:not(:disabled) { filter: brightness(1.08); }

  .status { font-size: 13px; color: var(--muted); font-family: var(--mono); }
  .status.pass { color: var(--pass); }
  .status.fail { color: var(--fail); }

  #github-panel { margin-bottom: 16px; }
  .gh-form {
    display: grid;
    grid-template-columns: 1.4fr 0.8fr 1.6fr 1.6fr auto;
    gap: 10px;
    padding: 14px;
    align-items: end;
  }
  @media (max-width: 900px) { .gh-form { grid-template-columns: 1fr 1fr; } }
  .gh-field { display: flex; flex-direction: column; gap: 4px; }
  .gh-field label { font-size: 11px; color: var(--muted); }
  .gh-field input {
    background: #06090d;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
  }
  .gh-field input:focus { border-color: var(--accent); }
  #gh-load {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #gh-load:hover:not(:disabled) { background: rgba(79, 176, 255, 0.1); }
  #gh-load:disabled { opacity: 0.5; cursor: default; }
  #gh-status { padding: 0 14px 14px; margin: 0; }

  #output {
    background: #06090d;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 120px;
    max-height: 480px;
    overflow-y: auto;
  }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Pytest in the Browser</h1>
    <p class="sub">Runs entirely client-side via Pyodide (WebAssembly Python). No server, no data leaves the page.</p>
  </header>

  <div class="panel" id="github-panel">
    <div class="panel-head"><span>Load from GitHub</span></div>
    <div class="gh-form">
      <div class="gh-field">
        <label for="gh-repo">Repo</label>
        <input id="gh-repo" type="text" placeholder="owner/repo" value="" />
      </div>
      <div class="gh-field">
        <label for="gh-branch">Branch</label>
        <input id="gh-branch" type="text" placeholder="main" value="main" />
      </div>
      <div class="gh-field">
        <label for="gh-source-path">Source file path</label>
        <input id="gh-source-path" type="text" placeholder="src/mymodule.py" />
      </div>
      <div class="gh-field">
        <label for="gh-test-path">Test file path</label>
        <input id="gh-test-path" type="text" placeholder="tests/test_module.py" />
      </div>
      <button id="gh-load">Load files</button>
    </div>
    <div id="gh-status" class="status"></div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-head"><span>Source — <code>mymodule.py</code></span></div>
      <textarea id="source-code" spellcheck="false">def add(a, b):
    return a + b


def divide(a, b):
    return a / b
</textarea>
    </div>

    <div class="panel">
      <div class="panel-head"><span>Tests — <code>test_module.py</code></span></div>
      <textarea id="test-code" spellcheck="false">from mymodule import add, divide
import pytest


def test_add():
    assert add(2, 3) == 5


def test_divide():
    assert divide(10, 2) == 5


def test_divide_by_zero():
    with pytest.raises(ZeroDivisionError):
        divide(1, 0)
</textarea>
    </div>
  </div>

  <div class="controls">
    <button id="run">Run tests</button>
    <span id="status" class="status">Loading Python runtime…</span>
  </div>

  <div class="panel">
    <div class="panel-head"><span>Output</span></div>
    <div id="output" class="empty">Test output will appear here.</div>
  </div>

</div>

<script>
let pyodideReadyPromise = null;
let pytestInstalled = false;

async function getPyodide() {
  if (!pyodideReadyPromise) {
    pyodideReadyPromise = loadPyodide();
  }
  return pyodideReadyPromise;
}

async function ensurePytest(pyodide, setStatus) {
  if (pytestInstalled) return;
  setStatus("Installing pytest (first run only)…");
  await pyodide.loadPackage("micropip");
  const micropip = pyodide.pyimport("micropip");
  // pytest and its dependencies are pure-Python wheels, installable via micropip
  await micropip.install(["pytest"]);
  pytestInstalled = true;
}

function setStatus(text, kind) {
  const el = document.getElementById("status");
  el.textContent = text;
  el.className = "status" + (kind ? " " + kind : "");
}

async function runTests() {
  const runBtn = document.getElementById("run");
  const outputEl = document.getElementById("output");
  const sourceCode = document.getElementById("source-code").value;
  const testCode = document.getElementById("test-code").value;

  runBtn.disabled = true;
  outputEl.classList.remove("empty");
  outputEl.textContent = "";
  setStatus("Starting up…");

  try {
    const pyodide = await getPyodide();
    await ensurePytest(pyodide, setStatus);

    setStatus("Running tests…");

    // Write the user's source and test files into Pyodide's virtual filesystem
    pyodide.FS.writeFile("/home/pyodide/mymodule.py", sourceCode);
    pyodide.FS.writeFile("/home/pyodide/test_module.py", testCode);

    const runner = `
import sys, io, contextlib, importlib, pytest

sys.path.insert(0, "/home/pyodide")

# Drop any previously-imported copies so edited source/test code
# actually gets re-imported instead of reusing stale cached modules.
for _modname in list(sys.modules):
    if _modname == "mymodule" or _modname == "test_module":
        del sys.modules[_modname]
importlib.invalidate_caches()

buf = io.StringIO()
with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
    exit_code = pytest.main(["-v", "--tb=short", "/home/pyodide/test_module.py"])

buf.getvalue(), int(exit_code)
`;
    const result = await pyodide.runPythonAsync(runner);
    const [text, exitCode] = result.toJs();

    outputEl.textContent = text;

    if (exitCode === 0) {
      setStatus("All tests passed", "pass");
    } else {
      setStatus("Tests failed (exit code " + exitCode + ")", "fail");
    }
  } catch (err) {
    outputEl.textContent = String(err);
    setStatus("Error running tests", "fail");
  } finally {
    runBtn.disabled = false;
  }
}

function setGhStatus(text, kind) {
  const el = document.getElementById("gh-status");
  el.textContent = text;
  el.className = "status" + (kind ? " " + kind : "");
}

async function fetchRawFile(repo, branch, path) {
  const url = `https://raw.githubusercontent.com/${repo}/${branch}/${path}`;
  const res = await fetch(url);
  if (!res.ok) {
    throw new Error(`${path} — HTTP ${res.status} (check repo/branch/path)`);
  }
  return res.text();
}

async function loadFromGithub() {
  const loadBtn = document.getElementById("gh-load");
  const repo = document.getElementById("gh-repo").value.trim().replace(/^\/|\/$/g, "");
  const branch = document.getElementById("gh-branch").value.trim() || "main";
  const sourcePath = document.getElementById("gh-source-path").value.trim().replace(/^\//, "");
  const testPath = document.getElementById("gh-test-path").value.trim().replace(/^\//, "");

  if (!repo || !sourcePath || !testPath) {
    setGhStatus("Fill in repo, source path, and test path first.", "fail");
    return;
  }

  loadBtn.disabled = true;
  setGhStatus(`Fetching from ${repo}@${branch}…`);

  try {
    const [sourceText, testText] = await Promise.all([
      fetchRawFile(repo, branch, sourcePath),
      fetchRawFile(repo, branch, testPath),
    ]);

    document.getElementById("source-code").value = sourceText;
    document.getElementById("test-code").value = testText;

    setGhStatus(`Loaded ${sourcePath} and ${testPath} from ${repo}@${branch}`, "pass");
  } catch (err) {
    setGhStatus("Failed to load: " + err.message, "fail");
  } finally {
    loadBtn.disabled = false;
  }
}

document.getElementById("gh-load").addEventListener("click", loadFromGithub);
document.getElementById("run").addEventListener("click", runTests);

// Warm up the runtime + pytest install in the background on page load
(async () => {
  try {
    const pyodide = await getPyodide();
    await ensurePytest(pyodide, setStatus);
    setStatus("Ready");
  } catch (err) {
    setStatus("Failed to load Python runtime: " + err, "fail");
  }
})();
</script>
</body>
</html>
